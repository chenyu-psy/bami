site_name: bami
site_description: Bayesian amortized model inference workflows for cognitive models.
repo_url: https://github.com/chenyu-psy/bami

theme:
  name: material
  palette:
    primary: white
    accent: blue
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Introduction: index.md
  - API Reference:
      - Package index: api/index.md
      - Workflows:
          - Workflow classes: api/workflows.md
      - Simulators:
          - SDM: api/simulators/sdm-circular.md
          - ezDM: api/simulators/ezdm.md
          - M3: api/simulators/m3.md
      - Parameters:
          - Population and individual parameters: api/parameters.md
      - Utilities: api/utils.md
      - Evaluation:
          - Metrics: api/evaluation/metrics.md
          - Diagnostics: api/evaluation/diagnostics.md
      - Advanced:
          - Input:
              - Input formats: api/inputs/formats.md
          - Inference:
              - Prior utilities: api/inference/priors-transforms.md
              - Saved workflows and runtime: api/inference/checkpoints-runtime.md
  - Articles:
      - articles/index.md
      - Start here:
          - Build and check a simple SDM workflow: articles/sdm-fixed-simple.md
      - Core concepts:
          - Write a simulator for your own model: articles/simulators.md
          - Choose priors and links for model parameters: articles/priors.md
      - Workflow design:
          - Choose the right workflow structure: articles/advanced-workflows.md
          - Fit a hierarchical ezDM workflow: examples/hierarchical-ezdm.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
