[project]
name = "bami"
version = "0.1.0"
description = "Bayesian amortized model inference workflows for user-defined and preset models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bayesflow>=2.0.12,<2.1",
    "keras",
    "matplotlib>=3.10.7",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
